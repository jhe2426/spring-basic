plugins {
    id 'org.springframework.boot' version '3.0.2'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'java'
}

group = 'hello'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

//스프링 부트 외부 라이브러리 버전 변경
//ext['tomcat.version']='10.1.4'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}


dependencies {

    /*
        라이브러리 직접 선택 시 발생하는 문제
        웹 프로젝트를 하나 설정하기 위해서는 수 많은 라이브러리를 알아야 한다. 여기에 추가로 각각의 라이브러리 버전까지 골라서
        선택해야 한다. 여기서 눈에 보이지 않는 가장 어려운 문제는 각 라이브러리들 간에 서로 호환이 잘 되는 버전도 있지만, 잘 안 되는
        버전도 있다는 점이다. 개발자가 라이브러리의 버전을 선택할 때 이런 부분까지 고려하는 것은 매우 어렵다.
    */
/*
    //1. 라이브러리 직접 지정
    //스프링 웹 MVC
    implementation 'org.springframework:spring-webmvc:6.0.4'
    //내장 톰캣
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.5'
    //JSON 처리
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.1'
    //스프링 부트 관련
    implementation 'org.springframework.boot:spring-boot:3.0.2'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:3.0.2'
    //LOG 관련
    implementation 'ch.qos.logback:logback-classic:1.4.5'
    implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.19.0'
    implementation 'org.slf4j:jul-to-slf4j:2.0.6'
    //YML 관련
    implementation 'org.yaml:snakeyaml:1.33'
*/

    /*
        dependency-management 버전 관리
        - io.spring.dependency-management 플러그인을 사용하면 spring-boot-dependencies에 있는 boom 정보를 참고한다.
        - 참고로 spring-boot-dependencies는 스프링 부트 gradle 플러그인에서 빌드할 떄나 사용이 되므로 개발자의 눈에 의존 관계로 보이지 않음

        버전 정보 bom
        - https://github.com/spring-projects/spring-boot/blob/main/platform/spring-boot-dependencies/build.gradle
        - 해당 build.gradle 문서안에 보면 bom이라는 항목이 있다.
        - 각각의 라이브러리에 대한 버전이 명시되어 있는 것을 확인할 수 있다.
        - 물론 현재 프로젝트에서 지정한 스프링 부트 버전을 참고한다.
            - id 'org.springframework.boot' version '3.0.2': 여기에 저장된 스프링 부트 버전 참고
            - 스프링 부트의 버전을 변경해보면 나머지 라이브러리들의 버전도 변하는 것을 확인할 수 있다.

        BOM(Bill of materials)
        - 자재 명세서(Bill of materials)란 제품을 구성하는 모든 부품들에 대한 목록이다.

        스프링 부트가 관리하는 외부 라이브러리 버전을 확인하는 방법
        https://docs.spring.io/spring-boot/appendix/dependency-versions/coordinates.html#appendix.dependency-versions.coordinates

        스프링 부트가 관리하지 않는 라이브러리
        - 스프링 부트가 관리하지 않는 외부 라이브러리도 있다. 특히 아직 잘 알려지지 않거나 대중적이지 않은 경우가 그러한데,
            이떄는 다음과 같이 라이브러리의 버전을 직접 적어주어야 한다.
        - implementation 'org.yaml:snakeyaml:1.30'

        정리
        - 스프링 부트가 제공하는 버전 관리는 스프링 자신을 포함해서 수 많은 외부 라이브러리의 버전을 최적화해서 관리해준다.
        - 이제 개발자는 스프링 부트 자체의 버전만 지정하면 된다.
        - 그리고 스프링 부트가 해당 스프링 부트 버전에 맞는 각 라이브러리의 호환성을 테스트 했기 때문에 안전하게 사용할 수 있다.
            (물론 항상 100% 완벽할 수는 없다.) 
    */
    //2. 스프링 부트 라이브러리 버전 관리
    //스프링 웹, MVC
    implementation 'org.springframework:spring-webmvc'
    //내장 톰캣
    implementation 'org.apache.tomcat.embed:tomcat-embed-core'
    //JSON 처리
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    //스프링 부트 관련
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    //LOG 관련
    implementation 'ch.qos.logback:logback-classic'
    implementation 'org.apache.logging.log4j:log4j-to-slf4j'
    implementation 'org.slf4j:jul-to-slf4j'
    //YML 관련
    implementation 'org.yaml:snakeyaml'

/*
    //3. 스프링 부트 스타터
    implementation 'org.springframework.boot:spring-boot-starter-web'
*/
}

tasks.named('test') {
    useJUnitPlatform()
}


